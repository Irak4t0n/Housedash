<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>House</title>
<style>
:root{--bg:#0b0f14;--card:#121923;--line:#1f2a38;--fg:#e6edf3;--dim:#8b98a8;--ok:#3ddc84;--warn:#ffb020;--bad:#ff5c5c;--acc:#4cc2ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:18px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
body{padding:1.8vh 2vw 1.2vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.2vh}
#ticker{height:3.4vw;background:var(--card);border:1px solid var(--line);border-radius:.8vw;overflow:hidden;position:relative;display:flex;align-items:center}
#ticker .lbl{flex:none;height:100%;display:flex;align-items:center;padding:0 1.1vw;background:#1a2332;color:var(--dim);font-size:.85vw;font-weight:700;letter-spacing:.14em;border-right:1px solid var(--line);z-index:2}
#ticker .win{flex:1;overflow:hidden;height:100%;position:relative}
#track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.ti{display:inline-flex;align-items:center;gap:.6vw;padding:0 1.6vw;font-size:1.15vw;color:var(--fg)}
.ti .tg{font-size:.75vw;font-weight:700;letter-spacing:.1em;padding:.15vw .5vw;border-radius:.35vw;background:var(--line);color:var(--dim)}
.ti .src{color:var(--dim);font-size:.9vw}
.tg.UFC{background:#3a1515;color:#ff8a8a}.tg.HACK{background:#153a26;color:var(--ok)}.tg.ESPORTS{background:#2a1a3a;color:#d7a6ff}.tg.GAMING{background:#1a2a3a;color:var(--acc)}.tg.HN{background:#3a2a13;color:var(--warn)}.tg.DRONE{background:#13303a;color:#7fe0ff}
a.ti,#wirelist a{color:inherit;text-decoration:none}a.ti:hover span:nth-child(2){text-decoration:underline;text-decoration-color:var(--acc)}
#ticker .lbl{cursor:pointer;user-select:none}
#wirepanel{position:fixed;left:2vw;right:2vw;bottom:5.2vw;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:1vw;padding:1vw 1.4vw;display:none;z-index:8;box-shadow:0 1vw 3vw #000c}
#wirepanel.show{display:block}
.wp-head{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:.9vw;letter-spacing:.12em;margin-bottom:.6vw}
.wp-head button{background:var(--line);color:var(--fg);border:0;border-radius:.4vw;padding:.3vw .9vw;font-size:.9vw;cursor:pointer}
.wl{padding:.45vw 0;border-bottom:1px solid var(--line);font-size:1.05vw}.wl:last-child{border-bottom:0}.wl a,.wl>span{display:flex;gap:.7vw;align-items:center}.wl .src{color:var(--dim);font-size:.85vw;margin-left:auto;white-space:nowrap}.wl a:hover span:nth-child(2){text-decoration:underline;text-decoration-color:var(--acc)}
.ti.sel{background:#1a2332;border-radius:.6vw;outline:2px solid var(--acc);outline-offset:-2px}
#qr{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}#qr.show{display:flex}
.qr-box{background:var(--card);border:1px solid var(--line);border-radius:1.2vw;padding:1.6vw;display:flex;gap:1.6vw;align-items:center;max-width:70vw;box-shadow:0 1vw 4vw #000}
#qr-img{width:22vw;height:22vw;background:#fff;border-radius:.8vw;padding:.6vw;display:flex;align-items:center;justify-content:center}#qr-img svg{width:100%;height:100%}
.qr-meta{max-width:38vw}#qr-text{font-size:1.6vw;font-weight:600;line-height:1.25}#qr-src{margin-top:.6vw;font-size:1vw;word-break:break-all}#qr-hint{margin-top:1vw;color:var(--acc);font-size:1vw}
body.tv #ticker .lbl{cursor:default}body.tv .lbl::after{content:"  ◀ ▶ OK";color:var(--acc);font-weight:500;letter-spacing:0;margin-left:.6vw}
.ctl{display:inline-flex;gap:.4vw;margin-left:auto}.btn{background:var(--line);color:var(--fg);border:0;border-radius:.4vw;padding:.15vw .6vw;font-size:.8vw;cursor:pointer;letter-spacing:0;text-transform:none}.btn:hover{background:#2a3647}.btn.warm{background:#3a3313;color:#ffd866}
body.tv .btn,body.tv .ctl,body.tv .bulb{pointer-events:none}body.tv .ctl{display:none}body.tv.lights .ctl{display:inline-flex;gap:.3vw}
.tvsel{outline:.22vw solid var(--acc);outline-offset:.15vw;border-radius:.5vw}
body.tv.lights [data-card="wiz"]{border-color:var(--acc);box-shadow:0 0 1.2vw #4cc2ff44}
body.tv [data-card="wiz"] .lbltxt::after{content:"  ▲ lights";color:var(--acc);font-weight:500;letter-spacing:0;margin-left:.6vw;opacity:.7}
body.tv.lights [data-card="wiz"] .lbltxt::after{content:"  ◀ ▶ pick · OK toggle · ▼ done"}
.bulb{cursor:pointer}.bulb:active{transform:scale(.95)}
.ppl{display:flex;flex-wrap:wrap;gap:.5vw;margin-bottom:.5vw}.pp{display:inline-flex;align-items:center;gap:.4vw;padding:.2vw .7vw;border-radius:1vw;background:var(--line);font-size:.95vw}.pp.home{background:#153a26;color:var(--ok)}.pp .sub{font-size:.8vw}
#storms{flex:none}.radarwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:.6vw;background:#000}.radarwrap img{max-width:100%;max-height:100%;object-fit:contain}
.verdict{display:inline-block;padding:.1vw .6vw;border-radius:.4vw;font-size:.85vw;font-weight:700;letter-spacing:.08em}.verdict.GO{background:#153a26;color:var(--ok)}.verdict.CAUTION{background:#3a3313;color:var(--warn)}.verdict.NO-GO{background:#3a1515;color:var(--bad)}
.spark{display:flex;align-items:flex-end;gap:1px;height:1.6vw;margin:.3vw 0}.spark i{flex:1;background:var(--acc);opacity:.7;border-radius:1px;min-width:2px}
.row .v{flex:none;max-width:62%;overflow:hidden;text-overflow:ellipsis}.row .n{flex:1;min-width:34%}.card h2 .sub,.card h2 .tag,.card h2 .verdict{margin-left:.5vw}.pac{font-size:1.6vw}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2vw .8vw;font-size:.85vw}.kv b{font-weight:500;color:var(--fg)}.kv span{color:var(--dim)}
.ti+.ti::before{content:"";width:.4vw;height:.4vw;border-radius:50%;background:var(--line);margin-right:1.2vw}
header{display:flex;justify-content:space-between;align-items:baseline}
header h1{margin:0;font-size:2vw;font-weight:600;letter-spacing:.02em}
header .clock{font-size:3.2vw;font-weight:300;font-variant-numeric:tabular-nums}
header .date{color:var(--dim);font-size:1.1vw}
header .wxnow{font-size:1.6vw;color:var(--fg);display:flex;gap:1.2vw;align-items:baseline}
header .wxnow b{font-size:2.6vw;font-weight:500}
main{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:.9vw;min-height:0}
.tall{grid-row:span 2}
.ev{display:flex;gap:.6vw;padding:.3vw 0;border-bottom:1px solid var(--line);font-size:1vw;align-items:baseline}.ev:last-child{border-bottom:0}
.ev .t{color:var(--dim);min-width:4.2vw;font-variant-numeric:tabular-nums;font-size:.9vw}.ev .c{width:.5vw;height:.5vw;border-radius:50%;flex:none;display:inline-block}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dayhdr{font-size:.8vw;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:.5vw 0 .2vw}
.card{background:var(--card);border:1px solid var(--line);border-radius:1vw;padding:1vw 1.2vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card h2{margin:0 0 .5vw;font-size:.95vw;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;display:flex;justify-content:space-between}
.big{font-size:2.8vw;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.sub{color:var(--dim);font-size:.95vw;margin-top:.25vw}
.row{display:flex;justify-content:space-between;align-items:center;padding:.3vw 0;border-bottom:1px solid var(--line);font-size:1.05vw;gap:1vw}
.row:last-child{border-bottom:0}.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .v{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:.65vw;height:.65vw;border-radius:50%;margin-right:.5vw;background:var(--dim);vertical-align:middle}
.dot.ok{background:var(--ok);box-shadow:0 0 .6vw var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.bar{height:.5vw;background:var(--line);border-radius:.25vw;overflow:hidden;margin-top:.5vw}.bar i{display:block;height:100%;background:var(--acc)}
.list{overflow:hidden;flex:1;min-height:0}
.bulbs{display:grid;grid-template-columns:repeat(5,1fr);gap:.4vw;margin-top:.3vw}
.bulb{padding:.45vw 0;border-radius:.5vw;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:.85vw;color:var(--dim);border:1px solid transparent}
body:not(.tv) .list{overflow:auto;scrollbar-width:none;-ms-overflow-style:none}body:not(.tv) .list::-webkit-scrollbar{display:none;width:0;height:0}
.bulb.on{background:#3a3313;border-color:#7a6a1d;color:#ffd866}
.bts{display:flex;flex-wrap:wrap;gap:.4vw;margin-top:.5vw}.bt{display:flex;align-items:center;gap:.3vw;border:1px solid var(--line);border-radius:.4vw;padding:.15vw .3vw .15vw .5vw;font-size:.85vw;color:var(--dim)}
.bt.gone{opacity:.45}.bt .nm{color:var(--fg)}.bt .nm::before{content:"ᛒ ";color:#4cc2ff;font-weight:700}.bt b{cursor:pointer;font-weight:500;padding:.1vw .4vw;border-radius:.3vw;background:var(--line);color:var(--fg)}.bt b:active{transform:scale(.95)}
body.tv .bt b{display:none}
.stale{color:var(--bad);font-size:.9vw}
.hours{display:flex;gap:.4vw;margin-top:.4vw}.hr{flex:1;text-align:center;font-size:.8vw;color:var(--dim)}.hr b{display:block;color:var(--fg);font-size:1.05vw;font-weight:500}.hr i{display:block;height:.35vw;background:var(--acc);border-radius:.2vw;margin-top:.3vw;opacity:.6}
.tag{display:inline-block;padding:.1vw .5vw;border-radius:.4vw;font-size:.85vw;background:var(--line);color:var(--fg)}
.tag.good{background:#153a26;color:var(--ok)}.tag.ok{background:#3a3313;color:var(--warn)}.tag.windy{background:#3a1515;color:var(--bad)}
.fish{display:flex;gap:1vw;margin-top:.3vw}.fish div{flex:1}.fish h3{margin:0 0 .2vw;font-size:.85vw;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.08em}.fish li{font-size:.95vw;list-style:none;padding:.12vw 0}
.tip{font-size:.9vw;color:var(--acc);margin-top:.4vw}
#alert{position:fixed;left:50%;top:2vh;transform:translateX(-50%);background:#3a1515;border:1px solid var(--bad);color:#fff;padding:1vw 2vw;border-radius:1vw;font-size:1.4vw;display:none;z-index:9;box-shadow:0 .5vw 2vw #000a}
#alert.show{display:block}
#mute{position:fixed;right:2vw;bottom:5.5vh;background:var(--card);border:1px solid var(--line);color:var(--dim);padding:.5vw 1vw;border-radius:.8vw;font-size:1vw;display:none;z-index:9;cursor:pointer}#mute.show{display:block}body.tv #mute{display:none}
.pac{font-size:2vw;letter-spacing:-.1em}.pac .pm{display:inline-block;color:#ffd866}.pac.chomp .pm{animation:chomp .22s steps(2) infinite}@keyframes chomp{to{transform:scaleY(.35)}}
</style><style id="tagcss"></style><script src="qrcode.min.js"></script></head><body>
<div id="alert"></div>
<div id="mute" title="browsers block sound until you interact with the page once">🔇 tap anywhere for sound</div>
<header>
 <div><h1 id="title">HOME</h1><div class="date" id="date"></div></div>
 <div class="wxnow" id="wxnow"></div>
 <div class="clock" id="clock">--:--</div>
</header>
<main>
 <section class="card" data-card="wx"><h2><span class="lbltxt">Weather</span> <span id="fly"></span></h2>
  <div class="list" id="wx"></div></section>
 <section class="card" data-card="tide"><h2><span class="lbltxt">Tide</span> <span class="sub" id="water"></span></h2>
  <div class="list" id="tide"></div></section>
 <section class="card" data-card="fish"><h2><span class="lbltxt">What's biting</span></h2><div class="list" id="fish"></div></section>
 <section class="card tall" data-card="lan"><h2><span class="lbltxt">Devices</span> <span class="sub" id="lan-count"></span></h2><div id="people"></div><div id="wol"></div><div class="list" id="lan"></div></section>
 <section class="card" data-card="pihole"><h2><span class="lbltxt">Pi-hole</span> <span id="ph-err" class="stale"></span></h2>
  <div class="big" id="ph-pct">--%</div><div class="sub"><span id="ph-blocked">-</span> blocked of <span id="ph-total">-</span> today · <span id="ph-clients">-</span> clients</div>
  <div class="bar"><i id="ph-bar" style="width:0"></i></div>
  <div class="list" id="ph-top" style="margin-top:.6vw"></div></section>
 <section class="card" data-card="pr"><h2><span class="lbltxt">Printers</span></h2><div class="list" id="pr"></div></section>
 <section class="card" data-card="wg"><h2><span class="lbltxt">VPN</span> <span id="wg-err" class="stale"></span></h2><div class="list" id="wg"></div></section>
 <section class="card" data-card="wiz"><h2><span class="lbltxt">Lights</span> <span class="sub" id="wiz-count"></span><span class="ctl"><button class="btn" data-lights="on">all on</button><button class="btn" data-lights="off">all off</button></span></h2><div class="list"><div class="bulbs" id="wiz"></div><div class="bts" id="ble"></div></div></section>
 <section class="card" data-card="net"><h2><span class="lbltxt">Internet · Pi</span> <span id="age" class="sub"></span></h2>
  <div class="list" id="net"></div>
  <div class="pac sub" style="margin-top:auto"><span class="pm">ᗧ</span><span id="pac-dots">·····</span>ᗣ <span id="pac-n"></span></div></section>
 <section class="card" data-card="sites"><h2><span class="lbltxt">Websites</span> <span class="sub" id="site-sum"></span></h2><div class="list" id="sites"></div></section>
 <section class="card" data-card="cal"><h2><span class="lbltxt">Calendar</span> <span class="sub" id="cal-sum"></span></h2><div class="list" id="cal"></div></section>
 <section class="card" data-card="flight"><h2><span class="lbltxt">Flight brief</span> <span id="fl-verdict"></span></h2><div class="list" id="flight"></div></section>
 <section class="card" data-card="radar"><h2><span class="lbltxt">Radar · Tropics</span> <span class="sub" id="rd-sum"></span></h2><div class="radarwrap"><img id="radar-img" alt=""></div><div class="list" id="storms"></div></section>
 <section class="card" data-card="security"><h2><span class="lbltxt">Security</span> <span class="sub" id="sec-sum"></span></h2><div class="list" id="security"></div></section>
</main>
<footer id="ticker"><div class="lbl" id="wirebtn" title="open the full wire">WIRE ▴</div><div class="win"><div id="track"></div></div></footer>
<div id="qr"><div class="qr-box"><div id="qr-img"></div><div class="qr-meta"><div id="qr-text"></div><div id="qr-src" class="sub"></div><div id="qr-hint" class="sub"></div></div></div></div>
<div id="wirepanel"><div class="wp-head"><span>THE WIRE · tap a headline to open it</span><button id="wireclose">close</button></div><div id="wirelist"></div></div>
<audio id="snd" preload="auto"><source src="sounds/newdevice.mp3" type="audio/mpeg"><source src="sounds/newdevice.ogg" type="audio/ogg"></audio>
<audio id="snd2" preload="auto"><source src="sounds/returned.mp3" type="audio/mpeg"><source src="sounds/returned.ogg" type="audio/ogg"></audio>
<audio id="snd3" preload="auto"><source src="sounds/nom.mp3?v=2" type="audio/mpeg"></audio>
<script>
const $=id=>document.getElementById(id);
const fmtAge=s=>s==null?'never':s<60?s+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d';
const fmtUp=s=>s>86400?Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h':Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';
const localDate=()=>{const d=new Date();try{if(TZ)return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}catch(e){}return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const h12=t=>{const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?'a':'p')};
let TZ;   // the Pi's time zone (state.tz) so every screen agrees even when a TV's own clock setting is off
function clock(){const d=new Date(), o=TZ?{timeZone:TZ}:{}; try{$('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',...o});$('date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',...o});}catch(e){TZ=undefined;}}
let announced=new Set();
function alertNew(list){
 const fresh=list.filter(d=>!announced.has(d.mac));
 if(!fresh.length) return;
 fresh.forEach(d=>announced.add(d.mac));
 const d=fresh[0];
 $('alert').textContent=`NEW DEVICE ON THE NETWORK: ${d.ip}  ${d.vendor||d.mac}`;
 $('alert').classList.add('show');
 const A=(CFG&&CFG.alerts)||{};
 if(A.sound_new!==false) playSnd('snd');
 setTimeout(()=>$('alert').classList.remove('show'),(+A.banner_new_s||20)*1000);
}
let ret=new Set();
function alertBack(list,quiet){
 const fresh=list.filter(d=>!ret.has(d.mac+d.ts));
 if(!fresh.length) return;
 fresh.forEach(d=>ret.add(d.mac+d.ts));
 const d=fresh[0];
 $('alert').style.background='#153a26';$('alert').style.borderColor='var(--ok)';
 $('alert').textContent=`${d.name} is back (away ${fmtAge(d.away)})`;
 $('alert').classList.add('show');
 const A=(CFG&&CFG.alerts)||{};
 if(!quiet&&A.sound_return!==false) playSnd('snd2');
 setTimeout(()=>{$('alert').classList.remove('show');$('alert').style.background='';$('alert').style.borderColor='';},(+A.banner_return_s||12)*1000);
}
// Browsers refuse audio until the page has been clicked/tapped once (the TV app exempts itself). When a sound is
// refused, show a small badge; the first click or key anywhere unlocks every sound on the page.
let soundLocked=false;
function playSnd(id){const a=$(id); if(!a) return; try{a.currentTime=0; a.play().then(()=>{soundLocked=false;$('mute').classList.remove('show');}).catch(e=>{if(e&&e.name==='NotAllowedError'){soundLocked=true;$('mute').classList.add('show');}});}catch(e){}}
function unlockSounds(){ if(!soundLocked) return; ['snd','snd2','snd3'].forEach(id=>{const a=$(id); if(a){a.muted=true; a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;});}}); soundLocked=false; $('mute').classList.remove('show'); }
document.addEventListener('pointerdown',unlockSounds,true); document.addEventListener('keydown',unlockSounds,true);
// Pac-Man eats an ad: when Pi-hole's blocked count goes up, chomp through the dots and play nom.mp3 (rate-limited; config alerts.*)
let lastBlocked=null, lastNom=0, chompTimer=null;
function nom(blocked,quiet){
 const A=(CFG&&CFG.alerts)||{}, prev=lastBlocked; lastBlocked=blocked;
 if(prev==null||blocked<=prev||A.sound_pacman===false) return;
 if(quiet&&!A.pacman_in_quiet) return;
 const gap=(A.pacman_gap_s==null?60:+A.pacman_gap_s)*1000; if(Date.now()-lastNom<gap) return; lastNom=Date.now();
 playSnd('snd3');
 const pac=document.querySelector('.pac'), dots=$('pac-dots'); if(!pac||!dots) return;
 pac.classList.add('chomp'); clearInterval(chompTimer); let n=5; dots.textContent='·····';
 chompTimer=setInterval(()=>{n--; dots.textContent='·'.repeat(Math.max(n,0))+' '.repeat(5-Math.max(n,0)); if(n<=0){clearInterval(chompTimer);setTimeout(()=>{pac.classList.remove('chomp');dots.textContent='·····';},500);}},500);
}
function render(s){
 if(s.cfg) applyCfg(s.cfg);
 if(s.tz&&s.tz!==TZ){TZ=s.tz;clock();}
 const now=Math.floor(Date.now()/1000), age=now-s.ts; $('age').textContent=age>120?'stale '+fmtAge(age):'';
 const p=s.pihole; if(p.ok){$('ph-pct').textContent=p.pct+'%';$('ph-blocked').textContent=p.blocked.toLocaleString();$('ph-total').textContent=p.total.toLocaleString();$('ph-clients').textContent=p.clients;$('ph-bar').style.width=p.pct+'%';$('ph-err').textContent='';
   $('ph-top').innerHTML=p.top_blocked.slice(0,4).map(([d,c])=>`<div class="row"><span class="n">${d}</span><span class="v">${c}</span></div>`).join('');$('pac-n').textContent=p.blocked.toLocaleString()+' ghosts today';nom(p.blocked,s.lan&&s.lan.quiet);}
 else $('ph-err').textContent=p.err;

// Slow auto-scroll for any card whose content overflows: hold at top, drift down at reading pace,
// hold at the bottom, then ease back up. Survives the 15 s re-render because position lives here, not in the DOM.
const SPEED=14, HOLD_TOP=5000, HOLD_BOT=4500, UP_SPEED=260;   // px/s, ms, ms, px/s
const scrollers=new Map();
function autoscroll(now){
 document.querySelectorAll('.list').forEach(el=>{
   let st=scrollers.get(el); if(!st){st={phase:'top',t:now,pos:0};scrollers.set(el,st);}
   if((!TV&&(el.matches(':hover')||now-(el._touched||0)<8000))||now<(el._hold||0)){st.last=now;st.pos=el.scrollTop;return;}   // hands off while someone is scrolling / picking in it
   const max=el.scrollHeight-el.clientHeight;
   if(max<=4){st.phase='top';st.pos=0;el.scrollTop=0;st.t=now;st.last=now;return;}
   const dt=(now-(st.last||now))/1000; st.last=now;
   if(st.phase==='top'){ if(now-st.t>HOLD_TOP){st.phase='down';} }
   else if(st.phase==='down'){ st.pos+=SPEED*dt; if(st.pos>=max){st.pos=max;st.phase='bot';st.t=now;} }
   else if(st.phase==='bot'){ if(now-st.t>HOLD_BOT){st.phase='up';} }
   else if(st.phase==='up'){ st.pos-=UP_SPEED*dt; if(st.pos<=0){st.pos=0;st.phase='top';st.t=now;} }
   if(Math.abs(el.scrollTop-st.pos)>0.5) el.scrollTop=st.pos;
 });
 requestAnimationFrame(autoscroll);
}
requestAnimationFrame(autoscroll);

 if(lZone&&els[lSel]){const l=els[lSel].closest('.list'); if(l){l._hold=performance.now()+30000; els[lSel].scrollIntoView({block:'nearest'});}}
}
function lightsEnter(){const card=document.querySelector('[data-card="wiz"]'); if(!card||card.style.display==='none') return false; tvExit(); lZone=true; lSel=Math.min(lSel,Math.max(0,lItems().length-1)); lightsHighlight(); clearTimeout(lIdle); lIdle=setTimeout(lightsExit,45000); return true;}
function lightsExit(){lZone=false; clearTimeout(lIdle); lightsHighlight();}
function lightsKey(k){
 clearTimeout(lIdle); lIdle=setTimeout(lightsExit,45000);
 const els=lItems(); if(!els.length){lightsExit();return 'handled';}
 if(k==='left'||k==='right'){lSel=(lSel+(k==='right'?1:-1)+els.length)%els.length; lightsHighlight(); return 'handled';}
 if(k==='back'||k==='down'||k==='up'){lightsExit(); return 'handled';}
 if(k==='ok'){const el=els[lSel]; el.style.opacity=.5; setTimeout(()=>el.style.opacity='',900);
   if(el.dataset.lights){act('/api/lights?action='+el.dataset.lights); for(const m in bleOn) bleOn[m]=el.dataset.lights==='on';}
   else if(el.dataset.ip){act('/api/light?ip='+encodeURIComponent(el.dataset.ip)+'&action=toggle');}
   else{const b=el.querySelector('b[data-ble]'); if(b){const m=b.dataset.ble, on=!(bleOn[m]??true); bleOn[m]=on; act('/api/blelight?mac='+encodeURIComponent(m)+'&action='+(on?'on':'off'));}}
   return 'handled';}
 return 'handled';
}
function tvKey(k){
 if(lZone) return lightsKey(k);
 if(k==='up'||k==='down'){ if(qrOpen) closeQr(); return lightsEnter()?'handled':'pass'; }
 if(k==='back'){ if(qrOpen){closeQr();return 'handled';} if(tvSel>=0){tvExit();return 'handled';} return 'pass'; }
 if(k==='left'||k==='right'){ if(qrOpen) closeQr(); tvSelect(tvSel<0?0:tvSel+(k==='right'?1:-1)); return 'handled'; }
 if(k==='ok'){ const els=tvItemsNow(); if(tvSel<0){tvSelect(0);return 'handled';}
   if(qrOpen){const u=$('qr').dataset.url; if(u){location.href=u;} return 'handled';}   // the app intercepts and opens the TV browser
   openQr(els[tvSel]); return 'handled'; }
 return 'pass';
}
window.tvKey=tvKey;
document.addEventListener('keydown',e=>{   // same controls on a PC keyboard / TV browser
 const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',Escape:'back',Backspace:'back'}; const k=map[e.key]; if(!k||e.target.closest('input,textarea')) return;
 if(k==='back'&&!qrOpen&&tvSel<0) return; if(tvKey(k)==='handled') e.preventDefault();
});
$('qr').addEventListener('click',closeQr);
if(TV) document.body.classList.add('tv');
// ---- controls (phone / PC view): lights, wake-on-LAN. They call the settings server's /api on :8089.
const API=()=>location.protocol+'//'+location.hostname+':'+((CFG&&CFG.network&&CFG.network.setup_port)||8089);
async function act(path){try{const r=await fetch(API()+path,{method:'POST'});const j=await r.json();if(!j.ok)console.warn(j);setTimeout(tick,1200);return j;}catch(e){console.warn(e)}}
document.addEventListener('click',e=>{
 if(TV) return;
 const b=e.target.closest('.bulb[data-ip]'); if(b){b.style.opacity=.5;act('/api/light?ip='+encodeURIComponent(b.dataset.ip)+'&action=toggle');return;}
 const al=e.target.closest('[data-lights]'); if(al){act('/api/lights?action='+al.dataset.lights);return;}
 const bb=e.target.closest('b[data-ble]'); if(bb){bb.style.opacity=.5;act('/api/blelight?mac='+encodeURIComponent(bb.dataset.ble)+'&action='+bb.dataset.act).then(()=>bb.style.opacity=1);return;}
 const w=e.target.closest('[data-wake]'); if(w){w.textContent='⏻ sending…';act('/api/wake?name='+encodeURIComponent(w.dataset.wake));return;}
});
async function tick(){try{const r=await fetch('state.json?'+Date.now(),{cache:'no-store'});render(await r.json());}catch(e){$('age').textContent='no data';}}
clock();setInterval(clock,1000);tick();pollTimer=setInterval(tick,POLL);
</script></body></html>
